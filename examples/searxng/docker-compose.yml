# A local SearXNG, so the research stage can search the web for free, with no account and no key.
#
#   export SEARXNG_SECRET="$(openssl rand -hex 32)"
#   docker compose -f examples/searxng/docker-compose.yml up -d --wait
#   export EI_SEARXNG_URL=http://127.0.0.1:8888
#
# It is published on the loopback interface only, and it refuses to start without a secret.
# The image is pinned by digest: the one below is the `latest` image of 2026-11-21 (built that day), the
# one this file was tested with. It does not update itself. To move to a newer SearXNG, pull it, start
# this file with it and check a search works, then replace the digest.
name: ei-searxng

services:
  searxng:
    image: searxng/searxng@sha256:fc1d81d7e9d04d3c8b3e23c7162feddf5c3d6aecd32e67a56eaabcb8d8747f79
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET, for example with openssl rand -hex 32}"
      SEARXNG_BASE_URL: http://127.0.0.1:${EI_SEARXNG_PORT:-8888}/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:${EI_SEARXNG_PORT:-8888}:8080"]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
