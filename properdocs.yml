site_name: engineering-influence
# The sentence a search result and an AI reader quote for the whole site: what it is, in a stranger's words.
site_description: >-
  engineering-influence writes a complete book, non-fiction or a novel, with nobody in the loop, and produces the
  files Amazon KDP asks for: interior PDF, EPUB, covers, listing and a quality report. One command installs it and
  one command writes a book, on a free local model by default.
site_url: https://adammatthewsteinberger.github.io/engineering-influence/
# Shown in the footer of every page.
copyright: '<a href="https://www.amazon.com/dp/B0HPWQFD3Y">Engineering Influence: A Playbook for the Remnant to Bring Christian Culture Back to America</a>'
repo_url: https://github.com/adammatthewsteinberger/engineering-influence
repo_name: adammatthewsteinberger/engineering-influence
# No "Edit on GitHub" link: the pages are assembled from the repository's own files, so a link to docs/<name>.md would be wrong.
edit_uri: ""

# The pages are assembled from the repository's own Markdown by scripts/build_docs_site.py, so a document is
# written once and read both on GitHub and here.
docs_dir: .site-src

theme:
  name: mkdocs

extra_css:
  - stylesheets/vibey.css
  - stylesheets/site.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code

plugins:
  - search

# A link that goes nowhere, or to a heading that is not there, fails the build instead of publishing.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Start:
      - Getting started: getting-started.md
      - Driving it from another AI: agents-driving.md
      - Books and KDP: books-and-kdp.md
      - Novels: novels.md
  - Writing books:
      - The local model: local-model.md
      - Model profiles: model-profiles.md
      - Model catalog: model-catalog.md
      - Model calls: model-calls.md
      - Research: research.md
      - Prompts: prompts.md
      - Skills: skills.md
      - Plugins: plugins.md
      - Tool lock: tool-lock.md
  - Reference:
      - Interfaces: interactions.md
      - Configuration: configuration.md
      - Compatibility: compatibility.md
      - Architecture: architecture.md
      - Threat model: threat-model.md
  - Operating:
      - Worker image: worker-image.md
      - Troubleshooting: troubleshooting.md
      - Releasing: releasing.md
      - Documentation site: documentation-site.md
      - Testing: testing.md
      - Evaluation: evaluation.md
      - Live smoke test: live-smoke-test.md
  - Project:
      - Contributing: contributing.md
      - How these documents are written: style.md
      - Decision records:
          - Overview: adr/index.md
          - "ADR 0001: Isolate vibey behind ports": adr/0001-vibey-integration-boundary.md
          - "ADR 0002: Audience priority and sovereign agent doctrine": adr/0002-audience-priority-and-sovereign-agent-doctrine.md
          - "ADR 0003: Definition of 1.0": adr/0003-definition-of-1-0.md
          - "ADR 0004: Versioning, compatibility and deprecation": adr/0004-versioning-compatibility-and-deprecation.md
          - "ADR 0005: Release flow and changelog fragments": adr/0005-release-flow-and-changelog-fragments.md
          - "ADR 0006: Onion layers, interfaces and one class per file": adr/0006-onion-layers-and-interfaces.md
          - "ADR 0007: Models are called over plain httpx, behind `ModelInterface`": adr/0007-model-transport-plain-httpx.md
          - "ADR 0008: The model gets tools, each stage gets only the ones it names": adr/0008-tools-for-the-model.md
          - "ADR 0009: Publishing follows the branch: develop to TestPyPI, main to PyPI": adr/0009-branch-driven-publishing.md
          - "ADR 0010: Chapters are drafted in order, inside one stage": adr/0010-chapters-are-drafted-in-order-in-one-stage.md
          - "ADR 0011: Run inputs are untrusted text carried inside the brief": adr/0011-run-inputs.md
          - "ADR 0012: Scripture quotations are checked against bundled translations": adr/0012-scripture-quotations-are-checked-against-bundled-translations.md
          - "ADR 0013: A factual claim is supported only by a quotation the code found in a page it read": adr/0013-fact-claims-need-a-quotation-the-code-found-in-a-page.md
      - Changelog: changelog.md
      - Security: security.md
      - Support: support.md
      - Code of conduct: code-of-conduct.md
