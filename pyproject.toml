[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-influence"
dynamic = ["version"]
description = "Autonomous book-writing pipeline (fiction and non-fiction) that produces KDP-ready self-publishing packages."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Matthew Steinberger" }]
keywords = ["publishing", "content-engineering", "pipeline", "epub", "kdp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
audio = ["mlx-audio>=0.6.8,<0.7; sys_platform == 'darwin' and platform_machine == 'arm64'", "misaki[en]>=0.9,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
webhooks = ["httpx>=0.27,<1"]
s3 = ["boto3>=1.35,<2"]
tracing = ["opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "opentelemetry-instrumentation-fastapi>=0.50b0,<1"]
runtime = [
  "vibey-engine>=0.4,<0.5", "aio-pika>=9.5,<11", "sqlmodel>=0.0.22,<1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1",
]
test = [
  "hypothesis>=6.120,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "pytest-xdist>=3.6,<4",
  "engineering-influence-sdk",
  "sqlmodel>=0.0.22,<1",
  "alembic>=1.14,<2",
  "aio-pika>=9.5,<11",
  "vibey-engine>=0.4,<0.5",
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
  "httpx>=0.27,<1",
  "boto3>=1.35,<2",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "uvicorn>=0.34,<1",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<8",
  "reportlab>=4.2,<6",
  "defusedxml>=0.7,<1",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
]
dev = ["mypy>=1.14,<3", "ruff>=0.9,<1", "import-linter>=2.1,<3", "bandit>=1.8,<2", "pip-audit>=2.7,<3"]
mcp = [
    "mcp>=2,<3",
]
publishing = [
  "defusedxml>=0.7,<1",
  "markdown-it-py>=3.0,<5",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<8",
  "numpy>=1.26,<3",
  "Pillow>=13.0,<14",
]

[project.urls]
Homepage = "https://github.com/adammatthewsteinberger/engineering-influence"
Source = "https://github.com/adammatthewsteinberger/engineering-influence"
Issues = "https://github.com/adammatthewsteinberger/engineering-influence/issues"
Changelog = "https://github.com/adammatthewsteinberger/engineering-influence/blob/develop/CHANGELOG.md"
Security = "https://github.com/adammatthewsteinberger/engineering-influence/security/policy"

[project.scripts]
ei = "engineering_influence.runtime.main:main"

[tool.hatch.version]
path = "src/engineering_influence/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_influence"]

# Hatch ships everything the top-level .gitignore does not name, which includes local
# tool caches and agent configuration. Say what an sdist contains instead.
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/pyproject.toml", "/README.md", "/LICENSE",
  "/CHANGELOG.md", "/SECURITY.md",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not distribution and not toolchain and not integration and not paid'"
markers = [
  "distribution: builds and installs the real artifacts; needs network access (pytest -m distribution)",
  "toolchain: builds the fixture book with real TeX and checks a snapshot (pytest -m toolchain)",
  "integration: runs against real PostgreSQL and RabbitMQ; start them with tests/integration/stack.sh (pytest -m integration tests/integration)",
  "paid: calls a real model provider and spends money; needs EI_ALLOW_PAID=1 as well (pytest -m paid)",
]

[tool.coverage.run]
branch = true
source = ["engineering_influence", "engineering_influence_sdk"]
# pytest-cov 7 no longer measures child processes on its own; tests that run `ei` in a fresh
# interpreter (missing-extra checks) need coverage's own subprocess patch, which writes
# per-process data files and so requires parallel mode.
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Docstring rules (E21): every public module, class, function, method and magic method is documented.
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = true
environments = ["python_version >= '3.12' and python_version < '3.15'"]

[tool.uv.workspace]
members = ["packages/engineering-influence-sdk"]

[tool.uv.sources]
engineering-influence-sdk = { workspace = true }

[tool.importlinter]
root_package = "engineering_influence"

[[tool.importlinter.contracts]]
name = "Layers point inward"
type = "layers"
containers = ["engineering_influence"]
layers = [
  "runtime",
  "interactions",
  "controllers | repositories | infrastructure",
  "services",
  "interfaces",
  "contracts",
  "models",
  "errors",
]

[[tool.importlinter.contracts]]
name = "Models depend on nothing else"
type = "forbidden"
source_modules = ["engineering_influence.models"]
forbidden_modules = [
  "engineering_influence.services", "engineering_influence.controllers",
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interactions", "engineering_influence.interfaces",
  "engineering_influence.contracts", "engineering_influence.runtime",
]

[[tool.importlinter.contracts]]
name = "Services and controllers never touch adapters or transports"
type = "forbidden"
source_modules = ["engineering_influence.services", "engineering_influence.controllers"]
forbidden_modules = [
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interactions", "engineering_influence.runtime",
]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "reportlab.*", "defusedxml", "defusedxml.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
