[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-influence"
version = "0.1.0a1"
description = "An autonomous, evidence-bounded content engineering pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Adam Matthew Steinberger" }]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
cli = ["typer>=0.15,<1"]
runtime = [
  "vibey-engine==4.5.0", "aio-pika>=9.5,<10", "sqlmodel>=0.0.22,<1",
  "psycopg[binary]>=3.2,<4",
]
test = [
  "hypothesis>=6.120,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "engineering-influence-sdk",
  "sqlmodel>=0.0.22,<1",
  "aio-pika>=9.5,<10",
  "vibey-engine==4.5.0",
  "fastapi>=0.115,<1",
  "mcp>=1.0,<2",
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<7",
  "reportlab>=4.2,<5",
  "defusedxml>=0.7,<1",
]
dev = ["mypy>=1.14,<2", "ruff>=0.9,<1", "import-linter>=2.1,<3", "bandit>=1.8,<2", "pip-audit>=2.7,<3"]
mcp = [
    "mcp>=1.0,<2",
]
publishing = [
  "defusedxml>=0.7,<1",
  "markdown-it-py>=3.0,<4",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<7",
  "numpy>=1.26,<3",
  "Pillow>=13.0,<14",
]

[project.scripts]
ei = "engineering_influence.interaction.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_influence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["engineering_influence", "engineering_influence_sdk"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/engineering-influence-sdk"]

[tool.uv.sources]
engineering-influence-sdk = { workspace = true }

[tool.importlinter]
root_package = "engineering_influence"

[[tool.importlinter.contracts]]
name = "Domain depends on nothing else"
type = "forbidden"
source_modules = ["engineering_influence.domain"]
forbidden_modules = [
  "engineering_influence.services", "engineering_influence.controllers",
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interaction", "engineering_influence.interfaces",
  "engineering_influence.contracts", "engineering_influence.runtime",
]

[[tool.importlinter.contracts]]
name = "Services and controllers never touch adapters or transports"
type = "forbidden"
source_modules = ["engineering_influence.services", "engineering_influence.controllers"]
forbidden_modules = [
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interaction", "engineering_influence.runtime",
]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "reportlab.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
