[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-influence"
dynamic = ["version"]
description = "An autonomous, evidence-bounded content engineering pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adam Matthew Steinberger" }]
keywords = ["publishing", "content-engineering", "pipeline", "epub", "kdp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
cli = ["typer>=0.15,<1"]
runtime = [
  "vibey-engine==4.5.0", "aio-pika>=9.5,<11", "sqlmodel>=0.0.22,<1",
  "psycopg[binary]>=3.2,<4",
]
test = [
  "hypothesis>=6.120,<7",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "engineering-influence-sdk",
  "sqlmodel>=0.0.22,<1",
  "aio-pika>=9.5,<11",
  "vibey-engine==4.5.0",
  "fastapi>=0.115,<1",
  "mcp>=1.0,<2",
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<7",
  "reportlab>=4.2,<5",
  "defusedxml>=0.7,<1",
]
dev = ["mypy>=1.14,<2", "ruff>=0.9,<1", "import-linter>=2.1,<3", "bandit>=1.8,<2", "pip-audit>=2.7,<3"]
mcp = [
    "mcp>=1.0,<2",
]
publishing = [
  "defusedxml>=0.7,<1",
  "markdown-it-py>=3.0,<4",
  "pdfplumber>=0.11,<1",
  "pypdf>=4.2,<7",
  "numpy>=1.26,<3",
  "Pillow>=13.0,<14",
]

[project.urls]
Homepage = "https://github.com/adammatthewsteinberger/engineering-influence"
Source = "https://github.com/adammatthewsteinberger/engineering-influence"
Issues = "https://github.com/adammatthewsteinberger/engineering-influence/issues"
Changelog = "https://github.com/adammatthewsteinberger/engineering-influence/blob/develop/CHANGELOG.md"
Security = "https://github.com/adammatthewsteinberger/engineering-influence/security/policy"

[project.scripts]
ei = "engineering_influence.interaction.cli.main:main"

[tool.hatch.version]
path = "src/engineering_influence/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_influence"]

# Hatch ships everything the top-level .gitignore does not name, which includes local
# tool caches and agent configuration. Say what an sdist contains instead.
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/pyproject.toml", "/README.md", "/LICENSE",
  "/CHANGELOG.md", "/SECURITY.md",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not distribution'"
markers = [
  "distribution: builds and installs the real artifacts; needs network access (pytest -m distribution)",
]

[tool.coverage.run]
branch = true
source = ["engineering_influence", "engineering_influence_sdk"]

[tool.coverage.report]
fail_under = 100

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/engineering-influence-sdk"]

[tool.uv.sources]
engineering-influence-sdk = { workspace = true }

[tool.importlinter]
root_package = "engineering_influence"

[[tool.importlinter.contracts]]
name = "Domain depends on nothing else"
type = "forbidden"
source_modules = ["engineering_influence.domain"]
forbidden_modules = [
  "engineering_influence.services", "engineering_influence.controllers",
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interaction", "engineering_influence.interfaces",
  "engineering_influence.contracts", "engineering_influence.runtime",
]

[[tool.importlinter.contracts]]
name = "Services and controllers never touch adapters or transports"
type = "forbidden"
source_modules = ["engineering_influence.services", "engineering_influence.controllers"]
forbidden_modules = [
  "engineering_influence.infrastructure", "engineering_influence.repositories",
  "engineering_influence.interaction", "engineering_influence.runtime",
]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "reportlab.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
