[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-influence-sdk"
version = "0.1.0a1"
description = "Typed sync and async client for engineering-influence."
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_influence_sdk"]
