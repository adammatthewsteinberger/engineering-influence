# The plan of record for the onion restructure (docs/adr/0006-onion-layers-and-interfaces.md).
# One entry per class. `old` is where the class lives today, `new` where it ends up. A pull
# request that moves or reclassifies a class edits its entry and says why in the PR. The
# architecture test keeps this file complete: every class in the tree appears exactly once,
# at its old or its new module.
# decision = "curated": a person chose the layer. decision = "signal": the layer follows
# from the rules in the ADR (kind and imports) and is reviewed in the PR that moves it.

[[class]]
old = "engineering_influence.contracts.health_status"
name = "HealthStatus"
new = "engineering_influence.contracts.health_status"
new_name = "HealthStatus"
layer = "contracts"
kind = "pydantic"
interface = "HealthStatusInterface"
interface_module = "engineering_influence.contracts.interfaces.health_status_interface"
interface_style = "abc"
decision = "signal"

