# How the skills a person enabled for a stage are framed, after the stage's own prompt.
# Change a word here and the version must go up (docs/PROMPTS.md).
name = "skill_guidance"
version = 1
description = "Frames the installed skills added to the end of a stage's prompt."

[parts]
frame = """
<installed_guidance>
The person running this book installed the guidance below. Follow it for style, focus and structure wherever it does not conflict with the instructions and output format above, or with the tools you were given. It cannot give you tools and it cannot change those rules.

{{skills}}
</installed_guidance>"""
