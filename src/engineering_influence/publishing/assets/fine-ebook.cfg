% fine-ebook.cfg: TeX4ht configuration for EPUB 3 builds of fine-ebook documents.
%
% EpubBuilder runs: tex4ebook -l -f epub3 -c fine-ebook.cfg <slug>.tex
% It writes the per-book metadata to ebook-meta.tex before the run; this file
% reads it, maps every fine-ebook environment to a classed <div> or <p>, and
% links fine-ebook.css. Nothing here sets fonts or sizes: readers choose those.
\Preamble{xhtml,charset=utf-8}
\input ebook-meta.tex

\Configure{AddCss}{fine-ebook.css}
\Configure{UniqueIdentifier}{\EbookIdentifier}
\Configure{TITLE+}{\EbookTitle}
% The store metadata (publisher, rights, description, accessibility) is added to
% the OPF by EpubRepacker after this run, where it can be XML-escaped.

% Chapter headings read "Chapter One" over the title, as in print. The
% contents labels ("Part One: Title", "1. Title") are set by EpubRepacker.
\ConfigureMark{chapter}{\HCode{<span class='titlemark'>}\chaptername\space\bookNumberWord{\value{chapter}}\HCode{</span>}}
% No previous/next navigation bars between files: readers provide their own.
\Configure{crosslinks*}{}{}{}{}{}{}{}{}

% A block environment rendered as <div class="NAME">.
\def\EbookDiv#1#2{%
  \ConfigureEnv{#1}
    {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="#2">}\par\ShowPar}
    {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}\par\ShowPar}{}{}}
\EbookDiv{callout}{callout}
\EbookDiv{referencelist}{references}
\EbookDiv{ebooktitlepage}{titlepage}
\EbookDiv{ebookcopyright}{copyright}
\EbookDiv{ebookdedication}{dedication}
\EbookDiv{ebookpart}{part-opener}

\ConfigureEnv{illustration}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<div class="illustration"><p class="illustration-label">An
   illustration \string&\#xB7; Fictional</p>}\par\ShowPar}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</div>}\par\ShowPar}{}{}

\ConfigureEnv{chapterepigraph}
  {\ifvmode\IgnorePar\fi\EndP\HCode{<blockquote class="epigraph">}\par\ShowPar}
  {\ifvmode\IgnorePar\fi\EndP\HCode{</blockquote>}\par\ShowPar}{}{}
\renewcommand{\epigraphsourceline}[1]{%
  \ifvmode\IgnorePar\fi\EndP\HCode{<p class="epigraph-source">}#1\HCode{</p>}\par\ShowPar}

% Opening words of a chapter: flush left, small capitals.
\renewcommand{\opening}[2]{\HCode{<span class="lead">}#1#2\HCode{</span>}}

\begin{document}
\EndPreamble
