# Two ClusterIssuers for the API's Ingress (ingress.issuer in the chart). They are cluster-scoped, so the platform applies
# them once, outside the Argo CD project (which creates no cluster-scoped objects):
#   kubectl apply -f deploy/cert-manager/clusterissuers.yaml
# The contact email receives Let's Encrypt's expiry notices. Dev and staging use
# letsencrypt-staging, which issues certificates browsers do not trust but has no rate limits; prod uses letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: adam@matthewsteinberger.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: adam@matthewsteinberger.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
