# Admission policies for the namespaces labelled policy.ei/restricted=true (the minikube install labels its namespace).
# The denying policy refuses a pod that does not run as non-root, or that has a privileged container. The audit policy
# reports containers without a memory limit without refusing them: several stateful pods of the stack do not set one
# yet. Only new and updated pods are checked, so a rollout of a workload is the moment its pods are checked.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ei-restricted-pods
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        policy.ei/restricted: "true"
  validations:
    - expression: >-
        has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
        && object.spec.securityContext.runAsNonRoot == true
      message: "pods in this namespace must run as non-root"
    - expression: >-
        (has(object.spec.initContainers) ? object.spec.initContainers : []).all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
        && object.spec.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) || c.securityContext.privileged == false)
      message: "privileged containers are not allowed"
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ei-audit-resources
spec:
  validationActions: ["Audit"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        policy.ei/restricted: "true"
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory))
      message: "containers should set a memory limit"
---
# The app's own pods must set a memory limit, so a rollout that drops it is refused. The stack's pods (Postgres,
# RabbitMQ, OpenBao, the observability services) do not set one yet, so the audit policy above keeps reporting them.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: ei-app-memory-limits
spec:
  validationActions: ["Deny"]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        policy.ei/restricted: "true"
    objectSelector:
      matchExpressions:
        - key: app.kubernetes.io/component
          operator: In
          values: ["api", "worker", "migration"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory))
        && (has(object.spec.initContainers) ? object.spec.initContainers : []).all(c,
          has(c.resources) && has(c.resources.limits) && has(c.resources.limits.memory))
      message: "the app's containers must set a memory limit"
---
# The release's images are signed by digest, keyless, by the release workflow on main (see .github/workflows/release.yml).
# This policy checks that signature for every image of the app in the restricted namespaces. It runs in Audit: an image
# the release did not sign is reported, not refused, until the signed release images are in use everywhere and the
# policy has been seen in Audit reports. Needs a Kyverno version that serves policies.kyverno.io/v1 ImageValidatingPolicy.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: ei-verify-release-images
spec:
  validationActions: ["Audit"]
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    namespaceSelector:
      matchLabels:
        policy.ei/restricted: "true"
  matchImageReferences:
    # One glob covers tags, digests (@sha256:...) and the bare name, so no reference form skips the check.
    - glob: "ghcr.io/adammatthewsteinberger/engineering-influence*"
  attestors:
    - name: release
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/adammatthewsteinberger/engineering-influence/.github/workflows/release.yml@refs/heads/main"
          ctlog:
            url: "https://rekor.sigstore.dev"
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
        && (has(images.initContainers) ? images.initContainers : {}).map(image,
          verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
        && (has(images.ephemeralContainers) ? images.ephemeralContainers : {}).map(image,
          verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
      message: "the image is not signed by the release workflow on main"
