# The staging environment. Like dev, its Postgres, OpenBao and object store are provisioned outside this chart, and
# openbao.server must be set to the staging OpenBao's address before the chart renders.
image:
  tag: "0.1.0rc2"

existingSecret: ei-secrets

# The ExternalSecret and SecretStore run as PreSync hooks, ahead of the migration, as in dev.
secretsAsPreSync: true

postgres:
  enabled: false

openbao:
  enabled: true
  devMode: false
  # The operator logs in as the chart's ServiceAccount, not with the dev root token. The platform configures the
  # OpenBao kubernetes auth mount and role (openbao.kubernetes in values.yaml).
  auth: kubernetes
  # Required: the address of the staging OpenBao. The chart refuses to render without it.
  server: ""

ingress:
  enabled: false
  host: engineering-influence-staging.duckdns.org
