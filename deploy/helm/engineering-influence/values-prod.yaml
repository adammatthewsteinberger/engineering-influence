# The production environment. Postgres, OpenBao and the object store are provisioned outside this chart, and
# openbao.server must be set to the production OpenBao's address before the chart renders.
image:
  tag: "0.1.0rc2"

existingSecret: ei-secrets

secretsAsPreSync: true

postgres:
  enabled: false

openbao:
  enabled: true
  devMode: false
  # Required: the address of the production OpenBao. The chart refuses to render without it.
  server: ""

api:
  replicas: 2

ingress:
  enabled: false
  host: engineering-influence.duckdns.org

# One pod at a time may be taken down by a drain (see the chart's PodDisruptionBudget).
podDisruptionBudget:
  enabled: true
