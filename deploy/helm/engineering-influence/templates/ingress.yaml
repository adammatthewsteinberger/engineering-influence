{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host }}
{{- fail "ingress.host is required when ingress.enabled is true" }}
{{- end }}
{{- if and .Values.ingress.tls (not .Values.ingress.tlsSecretName) }}
{{- fail "ingress.tlsSecretName names the Secret that holds the certificate when ingress.tls is true" }}
{{- end }}
# The API's public entry point. Without TLS it serves plain HTTP, which sends the API keys unencrypted, so keep ingress
# disabled until ingress.tls is on with a certificate in ingress.tlsSecretName. The API has a NetworkPolicy allowing
# this namespace, ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ei.fullname" . }}-api
  labels:
    {{- include "ei.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ei.fullname" . }}-api
                port:
                  name: http
{{- end }}
