{{- if .Values.openbao.enabled }}
{{- if and (not .Values.openbao.devMode) (ne .Values.openbao.auth "kubernetes") }}
{{- fail "openbao.devMode is false, so openbao.auth must be kubernetes: the dev root token is for a local cluster only" }}
{{- end }}
{{- $store := printf "%s-openbao" (include "ei.fullname" .) }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $store }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
  {{- if .Values.secretsAsPreSync }}
  annotations:
    # Before the migration (weight -5), so the Secret exists when the migration pod starts. Kept between upgrades.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  provider:
    vault:
      # Full name: the operator runs in its own namespace, where the short service name does not resolve.
      server: {{ if .Values.openbao.devMode }}http://{{ $store }}.{{ .Release.Namespace }}.svc:8200{{ else }}{{ .Values.openbao.server }}{{ end }}
      path: secret
      version: v2
      auth:
        {{- if eq .Values.openbao.auth "kubernetes" }}
        # The operator logs in as this chart's ServiceAccount, so no long-lived token is stored in the cluster. The
        # OpenBao side (a kubernetes auth mount, and a role bound to this ServiceAccount) is configured by the platform.
        kubernetes:
          mountPath: {{ .Values.openbao.kubernetes.mountPath | quote }}
          role: {{ .Values.openbao.kubernetes.role | quote }}
          serviceAccountRef:
            name: {{ include "ei.serviceAccountName" . }}
        {{- else }}
        tokenSecretRef:
          name: {{ .Values.openbao.bootstrapTokenSecret }}
          key: EI_OPENBAO_ROOT_TOKEN
        {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "existingSecret is required with openbao.enabled" .Values.existingSecret }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
  {{- if .Values.secretsAsPreSync }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.openbao.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.existingSecret }}
    creationPolicy: Owner
    # Replacing the ExternalSecret must not delete the Secret the pods read.
    deletionPolicy: Retain
  data:
    {{- range .Values.openbao.keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.openbao.path }}
        property: {{ . }}
    {{- end }}
{{- end }}
