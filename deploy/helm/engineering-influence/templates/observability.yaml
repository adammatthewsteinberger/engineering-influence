{{- if .Values.observability.enabled }}
{{- $prom := printf "%s-prometheus" (include "ei.fullname" .) }}
{{- $graf := printf "%s-grafana" (include "ei.fullname" .) }}
{{- $api := printf "%s-api" (include "ei.fullname" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: ei-api
        metrics_path: /metrics
        authorization:
          type: Bearer
          credentials_file: /etc/ei-metrics/key
        static_configs:
          - targets: ["{{ $api }}:{{ .Values.api.port }}"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ei.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        {{- include "ei.labels" . | nindent 8 }}
        app.kubernetes.io/component: prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: {{ printf "%s:%s" .Values.observability.prometheus.image.repository .Values.observability.prometheus.image.tag | quote }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: metrics-key
              mountPath: /etc/ei-metrics
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $prom }}
        - name: metrics-key
          secret:
            secretName: {{ required "existingSecret is required with observability.enabled" .Values.existingSecret }}
            items:
              - key: {{ .Values.observability.metricsApiKeyName | default "EI_METRICS_API_KEY" }}
                path: key
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  selector:
    app.kubernetes.io/name: {{ include "ei.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $graf }}-datasources
  labels:
    {{- include "ei.labels" . | nindent 4 }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prom }}:9090
        isDefault: true
      {{- if .Values.logs.enabled }}
      - name: Loki
        type: loki
        access: proxy
        url: http://{{ include "ei.fullname" . }}-loki:3100
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $graf }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ei.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "ei.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: {{ printf "%s:%s" .Values.observability.grafana.image.repository .Values.observability.grafana.image.tag | quote }}
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_ADMIN_PASSWORD__FILE
              value: /etc/grafana/admin-password
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: var
              mountPath: /var/lib/grafana
            - name: admin
              mountPath: /etc/grafana/admin-password
              subPath: admin-password
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: {{ $graf }}-datasources
        - name: tmp
          emptyDir: {}
        - name: var
          emptyDir: {}
        - name: admin
          secret:
            secretName: {{ .Values.existingSecret }}
            items:
              - key: EI_GRAFANA_ADMIN_PASSWORD
                path: admin-password
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $graf }}
  labels:
    {{- include "ei.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  selector:
    app.kubernetes.io/name: {{ include "ei.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
{{- end }}
