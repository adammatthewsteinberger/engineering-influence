{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "api" "worker" }}
---
# One pod at a time may be taken down by a drain. maxUnavailable, not minAvailable: with one worker, minAvailable 1
# would block every node drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ei.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ei.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ei.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
