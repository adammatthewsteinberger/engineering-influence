---
# Source: engineering-influence/templates/deployment-api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ei-engineering-influence-api
  labels:
    app.kubernetes.io/name: engineering-influence
    app.kubernetes.io/instance: ei
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: engineering-influence
      app.kubernetes.io/instance: ei
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-influence
        app.kubernetes.io/instance: ei
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: ei-engineering-influence
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/adammatthewsteinberger/engineering-influence:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["serve", "api"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: EI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_DATABASE_URL
            - name: EI_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_RABBITMQ_URL
            - name: EI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_API_KEYS
          envFrom:
            - configMapRef:
                name: ei-engineering-influence-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

