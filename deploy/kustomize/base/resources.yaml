# Source: engineering-influence/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: ei-engineering-influence-migrate
  labels:
    app.kubernetes.io/name: engineering-influence
    app.kubernetes.io/instance: ei
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migration
  annotations:
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: engineering-influence
        app.kubernetes.io/instance: ei
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: ei-engineering-influence
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: "ghcr.io/adammatthewsteinberger/engineering-influence:0.1.0"
          imagePullPolicy: IfNotPresent
          args: ["db", "upgrade"]
          env:
            - name: EI_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_DATABASE_URL
            - name: EI_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_RABBITMQ_URL
            - name: EI_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: ei-secrets
                  key: EI_API_KEYS
          envFrom:
            - configMapRef:
                name: ei-engineering-influence-config
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

