name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra test --extra runtime --extra dev
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run bandit -q -r src packages
      - run: uv run pip-audit
      - run: uv run mypy --strict src packages
      - run: uv run pytest --cov --cov-branch --cov-fail-under=100

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject private-content paths
        run: |
          ! git rev-list --objects --all | grep -E '(^|/)(manuscripts|living-waters)/|\.(pdf|docx)$'
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
