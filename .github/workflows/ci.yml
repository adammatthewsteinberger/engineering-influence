name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A push to a branch that is not a pull request runs to the end,
# so every commit that lands on develop is checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the jobs that build, test or package the code run. A change that touches only docs, README files
  # or changelog fragments skips them. The unit suite (which holds the docs tests) and the repository-level gates
  # (leak-scan, provenance, workflows) always run. A skipped job counts as passing for a required check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!changelog.d/**'

  # Every supported Python runs every gate. The image, the distribution build and the release use
  # 3.13; the lock resolves 3.12 to 3.14 (pyproject.toml, [tool.uv] environments).
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # --locked fails when uv.lock is out of step with pyproject.toml (the `uv lock --check` gate).
      - run: uv sync --locked --extra test --extra runtime --extra dev --extra publishing
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run bandit -q -r src packages
      - run: uv run pip-audit
      - run: uv run mypy --strict src packages
      # Linux runs each locked MCP server under bubblewrap (see docs/TOOL_LOCK.md). Ubuntu 24.04 restricts the
      # unprivileged user namespaces bubblewrap needs, so this ephemeral runner allows them.
      - name: Install bubblewrap for the native MCP sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run the tests (the native sandbox must run here)
        run: uv run pytest --cov --cov-branch --cov-fail-under=100 -n auto
        env:
          EI_REQUIRE_NATIVE_SANDBOX: "1"

  # Renders the Helm chart with default values and with every optional object on, validates each render against the
  # Kubernetes schemas, and builds each Kustomize overlay the same way. Then it builds the image and scans it with Trivy
  # for fixable HIGH and CRITICAL vulnerabilities. CRDs with no bundled schema (External Secrets, KEDA) are skipped, not failed.
  kubernetes:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Lint and validate the chart, with defaults and with every optional object on
        run: |
          set -euo pipefail
          chart=deploy/helm/engineering-influence
          every=(--set existingSecret=ei-secrets --set openbao.enabled=true --set postgres.enabled=true
            --set rabbitmq.enabled=true --set observability.enabled=true --set logs.enabled=true
            --set tracing.enabled=true --set seaweedfs.enabled=true --set artifactStore.kind=s3
            --set artifactStore.bucket=ei-artifacts --set autoscaling.api.enabled=true --set autoscaling.keda.enabled=true)
          helm lint "$chart" --set existingSecret=ei-secrets
          helm lint "$chart" "${every[@]}"
          helm template ei "$chart" --set existingSecret=ei-secrets | kubeconform -strict -summary -ignore-missing-schemas
          helm template ei "$chart" "${every[@]}" | kubeconform -strict -summary -ignore-missing-schemas
      - name: Build each Kustomize overlay and validate it
        run: |
          set -euo pipefail
          for overlay in dev prod; do
            kubectl kustomize "deploy/kustomize/overlays/$overlay" | kubeconform -strict -summary -ignore-missing-schemas
          done
      # BuildKit with the GitHub Actions cache: a rebuild reuses the layers of the last build on this branch, and the
      # image is loaded into the daemon for the Trivy scan below, so it is built once per run.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ei-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ei-ci:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Builds a synthetic book with the real toolchain (LuaLaTeX, tex4ebook, epubcheck) and compares
  # the result with a checked-in structural snapshot. The runner image is pinned because the
  # snapshot depends on the TeX Live release; a deliberate change is accepted by re-running the
  # test with EI_UPDATE_SNAPSHOT=1 and committing the new file (see docs/TESTING.md).
  toolchain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Cached .deb archives skip the 300 MB download on most runs. Without a cache the mirror can
      # throttle a connection part-way through (a 17 MB package once took five minutes, and a whole
      # attempt can stall), so the download runs in short two-minute attempts: apt resumes partial files, a fresh connection is usually
      # fast, and stopping a download is safe in a way that stopping an install is not.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-archives/*.deb
          key: texlive-noble-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: texlive-noble-
      - name: Install the TeX toolchain
        timeout-minutes: 20
        env:
          ARCHIVES: ${{ runner.temp }}/apt-archives
          PACKAGES: >-
            latexmk texlive-luatex texlive-latex-recommended texlive-latex-extra
            texlive-pictures texlive-fonts-recommended texlive-plain-generic
            texlive-extra-utils epubcheck default-jre-headless poppler-utils fonts-texgyre
        run: |
          set -eu
          mkdir -p "$ARCHIVES"
          read -r -a packages <<< "$PACKAGES"
          options=(-o "Dir::Cache::archives=$ARCHIVES" -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          sudo apt-get "${options[@]}" update
          for attempt in 1 2 3 4 5 6; do
            if sudo timeout 120 apt-get "${options[@]}" install -y --download-only --no-install-recommends "${packages[@]}"; then
              break
            fi
            [ "$attempt" -lt 6 ] || { echo "the package download kept stalling" >&2; exit 1; }
            echo "download attempt $attempt stalled; trying again" >&2
          done
          sudo apt-get "${options[@]}" install -y --no-install-recommends "${packages[@]}"
      - run: uv sync --locked --extra test --extra runtime --extra publishing
      - run: uv run pytest -m toolchain -p no:cacheprovider -v
        env:
          EI_SNAPSHOT_ARTIFACT_DIR: ${{ runner.temp }}/fixture-snapshot
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-snapshot
          path: ${{ runner.temp }}/fixture-snapshot
          if-no-files-found: ignore

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # What may live here, and where prompts and fixtures go: CONTRIBUTING.md, "What may live in this repository".
      - name: Reject private-content paths
        run: |
          ! git rev-list --objects HEAD | grep -E '(^|/)(manuscripts|living-waters|archive|prompts|chapters)/|^output/|\.(pdf|docx)$'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # vibey-gh ships inside vibey-engine; install the exact version uv.lock pins instead of
      # asking the index, which no longer lists the 4.5.0 this job used to request.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra runtime
      # Every source file must carry the fingerprint header.
      - run: uv run vibey-gh check --ci
      # Every NEW commit must carry the Made-With trailer. Pull requests are judged
      # over their own range only; history that predates adoption is not rewritten.
      # Dependabot writes its own commit messages and cannot add the trailer, so pull
      # requests that Dependabot opened are exempt from the provenance check only
      # (conventional commits are still checked below). The PR author is used, not the
      # pusher, so a maintainer's follow-up push to the branch does not break the PR.
      # A release pull request (develop into main) adds everything since the last release, and that includes
      # squash commits that lost their trailer before the squash message kept it. History is not rewritten, so a
      # pull request into main is judged from the newest of those commits onward; every other pull request is
      # judged over its own range, as before. Once main holds the release, its tip is later than this commit and
      # the range is the pull request's own again.
      - id: range
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          baseline=7e80218753c42305318ce6c65c1c52a1da900b3f
          start="$BASE"
          if [ "$BASE_REF" = main ] && git merge-base --is-ancestor "$BASE" "$baseline"; then
            start="$baseline"
          fi
          echo "commits=$start..$HEAD" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.ref != 'main'
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
        run: uv run vibey-gh provenance-check --commits "$COMMITS"
      # A release pull request also carries Dependabot's commits that reached develop; they cannot add the trailer. So it
      # is checked one commit at a time: Dependabot-authored commits, and merges of them, are skipped, and every other
      # commit must pass on its own. The range form cannot skip a single commit.
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.base.ref == 'main'
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          set -eu
          # Dependabot's exact noreply address; a name that merely contains "dependabot" does not match.
          is_dependabot() { [ "$1" = '49699333+dependabot[bot]@users.noreply.github.com' ]; }
          skipped=0
          processed=0
          while read -r sha <&3; do
            processed=$((processed + 1))
            if is_dependabot "$(git log -1 --format='%ae' "$sha")"; then skipped=$((skipped + 1)); continue; fi
            # A merge is skipped only when every commit it brings in is Dependabot's. Its own diff is not trusted.
            read -r first second _ <<< "$(git log -1 --format='%P' "$sha")"
            if [ -n "$second" ]; then
              brought=0
              only=yes
              while read -r c; do
                brought=$((brought + 1))
                is_dependabot "$(git log -1 --format='%ae' "$c")" || only=no
              done < <(git rev-list "$first..$second")
              if [ "$brought" -gt 0 ] && [ "$only" = yes ]; then skipped=$((skipped + 1)); continue; fi
            fi
            uv run vibey-gh provenance-check --commits "$sha^..$sha" </dev/null
          done 3< <(git rev-list --reverse "$COMMITS")
          total="$(git rev-list --count "$COMMITS")"
          [ "$processed" -eq "$total" ] || { echo "checked $processed of $total commits" >&2; exit 1; }
          echo "skipped $skipped Dependabot commits or merges that brought only Dependabot commits"
      - if: github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'main'
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
        run: uv run vibey-gh conventional-check --commits "$COMMITS"
      # A release pull request is checked commit by commit, skipping the same Dependabot commits and merges as the
      # provenance check above: GitHub's merge of a Dependabot pull request has a subject that cannot be conventional.
      - if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          set -eu
          is_dependabot() { [ "$1" = '49699333+dependabot[bot]@users.noreply.github.com' ]; }
          skipped=0
          processed=0
          while read -r sha <&3; do
            processed=$((processed + 1))
            if is_dependabot "$(git log -1 --format='%ae' "$sha")"; then skipped=$((skipped + 1)); continue; fi
            read -r first second _ <<< "$(git log -1 --format='%P' "$sha")"
            if [ -n "$second" ]; then
              brought=0
              only=yes
              while read -r c; do
                brought=$((brought + 1))
                is_dependabot "$(git log -1 --format='%ae' "$c")" || only=no
              done < <(git rev-list "$first..$second")
              if [ "$brought" -gt 0 ] && [ "$only" = yes ]; then skipped=$((skipped + 1)); continue; fi
            fi
            uv run vibey-gh conventional-check --commits "$sha^..$sha" </dev/null
          done 3< <(git rev-list --reverse "$COMMITS")
          total="$(git rev-list --count "$COMMITS")"
          [ "$processed" -eq "$total" ] || { echo "checked $processed of $total commits" >&2; exit 1; }
          echo "skipped $skipped Dependabot commits or merges that brought only Dependabot commits"

  compose-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image, starts Postgres, RabbitMQ, the API and a worker with throwaway
      # credentials, runs a two-stage pipeline through them and checks dead-lettering.
      - run: sh examples/compose_smoke.sh

  # Runs the integration tests against a real PostgreSQL and RabbitMQ, started by the same script a
  # developer uses (tests/integration/stack.sh) with random throwaway credentials. They cover the
  # migrations on PostgreSQL, the stores under concurrent writers, jobs through the broker, and a book
  # run that finishes through the stack however its workers die. EI_REQUIRE_INTEGRATION turns a
  # missing stack into a failure instead of a skip, so this job cannot pass with nothing tested.
  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EI_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra test --extra runtime
      - run: |
          eval "$(sh tests/integration/stack.sh up)"
          for url in "$EI_TEST_DATABASE_URL" "$EI_TEST_RABBITMQ_URL"; do
            echo "::add-mask::$(printf '%s' "$url" | sed 's#^[^:]*://[^:]*:\([^@]*\)@.*#\1#')"
          done
          uv run pytest -m integration -q tests/integration
      - if: always()
        run: sh tests/integration/stack.sh down

  # The same build the release uses, so a tag can only publish what CI has been building all along.
  distribution:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-distribution.yml

  # Static checks for the workflows themselves, including the release pipeline.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.32.0 --no-progress --min-severity medium .github

