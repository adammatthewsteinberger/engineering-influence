name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every supported Python runs every gate. The image, the distribution build and the release use
  # 3.13; the lock resolves 3.12 to 3.14 (pyproject.toml, [tool.uv] environments).
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # --locked fails when uv.lock is out of step with pyproject.toml (the `uv lock --check` gate).
      - run: uv sync --locked --extra test --extra runtime --extra dev --extra publishing
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run bandit -q -r src packages
      - run: uv run pip-audit
      - run: uv run mypy --strict src packages
      - run: uv run pytest --cov --cov-branch --cov-fail-under=100

  # Builds a synthetic book with the real toolchain (LuaLaTeX, tex4ebook, epubcheck) and compares
  # the result with a checked-in structural snapshot. The runner image is pinned because the
  # snapshot depends on the TeX Live release; a deliberate change is accepted by re-running the
  # test with EI_UPDATE_SNAPSHOT=1 and committing the new file (see docs/TESTING.md).
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A slow mirror once held this step for over twenty minutes; retries and timeouts make a bad
      # mirror fail fast or recover, instead of hanging the job.
      - name: Install the TeX toolchain
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            latexmk texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-plain-generic \
            texlive-extra-utils epubcheck default-jre-headless
      - run: uv sync --locked --extra test --extra runtime --extra publishing
      - run: uv run pytest -m toolchain -p no:cacheprovider -v
        env:
          EI_SNAPSHOT_ARTIFACT_DIR: ${{ runner.temp }}/fixture-snapshot
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-snapshot
          path: ${{ runner.temp }}/fixture-snapshot
          if-no-files-found: ignore

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # What may live here, and where prompts and fixtures go: CONTRIBUTING.md, "What may live in this repository".
      - name: Reject private-content paths
        run: |
          ! git rev-list --objects HEAD | grep -E '(^|/)(manuscripts|living-waters|archive|prompts|chapters)/|^output/|\.(pdf|docx)$'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # vibey-gh ships inside vibey-engine; install the exact version uv.lock pins instead of
      # asking the index, which no longer lists the 4.5.0 this job used to request.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - run: uv sync --locked --extra runtime
      # Every source file must carry the fingerprint header.
      - run: uv run vibey-gh check --ci
      # Every NEW commit must carry the Made-With trailer. Pull requests are judged
      # over their own range only; history that predates adoption is not rewritten.
      # Dependabot writes its own commit messages and cannot add the trailer, so pull
      # requests that Dependabot opened are exempt from the provenance check only
      # (conventional commits are still checked below). The PR author is used, not the
      # pusher, so a maintainer's follow-up push to the branch does not break the PR.
      - if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: uv run vibey-gh provenance-check --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - if: github.event_name == 'pull_request'
        run: uv run vibey-gh conventional-check --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image, starts Postgres, RabbitMQ, the API and a worker with throwaway
      # credentials, runs a two-stage pipeline through them and checks dead-lettering.
      - run: sh examples/compose_smoke.sh

  # The same build the release uses, so a tag can only publish what CI has been building all along.
  distribution:
    permissions:
      contents: read
    uses: ./.github/workflows/build-distribution.yml

  # Static checks for the workflows themselves, including the release pipeline.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.32.0 --no-progress --min-severity medium .github

