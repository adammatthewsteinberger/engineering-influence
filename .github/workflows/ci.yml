name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra test --extra runtime --extra dev --extra publishing
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run bandit -q -r src packages
      - run: uv run pip-audit
      - run: uv run mypy --strict src packages
      - run: uv run pytest --cov --cov-branch --cov-fail-under=100

  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject private-content paths
        run: |
          ! git rev-list --objects HEAD | grep -E '(^|/)(manuscripts|living-waters|archive|prompts|chapters)/|^output/|\.(pdf|docx)$'
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "vibey-engine==4.5.0"
      # Every source file must carry the fingerprint header.
      - run: vibey-gh check --ci
      # Every NEW commit must carry the Made-With trailer. Pull requests are judged
      # over their own range only; history that predates adoption is not rewritten.
      - if: github.event_name == 'pull_request'
        run: |
          vibey-gh provenance-check --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          vibey-gh conventional-check --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image, starts Postgres, RabbitMQ, the API and a worker with throwaway
      # credentials, runs a two-stage pipeline through them and checks dead-lettering.
      - run: sh examples/compose_smoke.sh

  # The same build the release uses, so a tag can only publish what CI has been building all along.
  distribution:
    permissions:
      contents: read
    uses: ./.github/workflows/build-distribution.yml

  # Static checks for the workflows themselves, including the release pipeline.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.6"
      - run: uvx --from actionlint-py==1.7.12 actionlint
      - run: uvx zizmor==1.32.0 --no-progress --min-severity medium .github

