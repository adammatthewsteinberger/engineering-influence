# Publishing a release: push a tag named v<version> from the main branch.
#
#   1. The guard job checks the tag matches the code, the changelog and the main branch.
#   2. The build job is the same reusable workflow CI runs on every push, plus the full tests.
#   3. The GitHub release attaches the artifacts with signed build provenance.
#   4. Publishing to PyPI is last, is skipped unless the repository variable
#      PUBLISH_TO_PYPI is 'true', and waits for approval of the 'pypi' environment.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match the code, the changelog and the main branch
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          core="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/engineering_influence/__init__.py)"
          sdk="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/engineering-influence-sdk/src/engineering_influence_sdk/__init__.py)"
          [ -n "$core" ] || { echo "could not read the package version" >&2; exit 1; }
          [ "$core" = "$sdk" ] || { echo "core $core and sdk $sdk versions differ" >&2; exit 1; }
          [ "$TAG" = "v$core" ] || { echo "tag $TAG does not match version $core" >&2; exit 1; }
          # The dots in a version are regex wildcards; escape them so only this exact version matches.
          pattern="$(printf '%s' "$core" | sed 's/[][\.*^$+?(){}|]/\\&/g')"
          grep -Eq "^## \[?$pattern\]?( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $core' section" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on the main branch" >&2; exit 1; }
          echo "releasing $core"

  build:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-distribution.yml
    with:
      run_tests: true

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          flag=""
          case "$TAG" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev*) flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" $flag

  pypi:
    needs: github-release
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure the trusted publisher for both projects on PyPI, and require reviewers on this
    # environment, before setting PUBLISH_TO_PYPI. See docs/RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/project/engineering-influence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions
        run: |
          set -eu
          mkdir pypi-dist
          mv dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          attestations: true
