# Publishing a release: push a tag named v<version> from the main branch.
#
#   1. The guard job checks the tag matches the code, the changelog and the main branch.
#   2. The build job is the same reusable workflow CI runs on every push, plus the full tests.
#   3. The GitHub release attaches the artifacts with signed build provenance.
#   4. A rehearsal on TestPyPI (the core, then the SDK) runs only if the repository variable
#      PUBLISH_TO_TESTPYPI is 'true'.
#   5. Publishing to PyPI is last, is skipped unless the repository variable PUBLISH_TO_PYPI is
#      'true', waits for the rehearsal if there was one (a failed rehearsal stops it), and waits
#      for approval of the 'pypi' environment. The SDK is uploaded by its own job after the core,
#      from its own environment ('pypi-sdk'), because PyPI tells pending publishers apart by it.
name: Release

on:
  push:
    tags: ["v*"]
  # The same pipeline, started by hand for a tag that already exists. Use it if a tag push does not
  # start the workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to release, for example v0.1.0a1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must match the code, the changelog and the main branch
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          core="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/engineering_influence/__init__.py)"
          sdk="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' packages/engineering-influence-sdk/src/engineering_influence_sdk/__init__.py)"
          [ -n "$core" ] || { echo "could not read the package version" >&2; exit 1; }
          [ "$core" = "$sdk" ] || { echo "core $core and sdk $sdk versions differ" >&2; exit 1; }
          [ "$TAG" = "v$core" ] || { echo "tag $TAG does not match version $core" >&2; exit 1; }
          # The dots in a version are regex wildcards; escape them so only this exact version matches.
          pattern="$(printf '%s' "$core" | sed 's/[][\.*^$+?(){}|]/\\&/g')"
          grep -Eq "^## \[?$pattern\]?( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $core' section" >&2; exit 1; }
          leftover="$(find changelog.d -type f -name '*.md' ! -name README.md 2>/dev/null | head -n 1)"
          [ -z "$leftover" ] || { echo "$leftover is an unfolded changelog fragment; run scripts/fold_changelog.py" >&2; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "$TAG is not on the main branch" >&2; exit 1; }
          echo "releasing $core"

  build:
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/build-distribution.yml
    with:
      run_tests: true
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          flag=""
          case "$TAG" in *a[0-9]*|*b[0-9]*|*rc[0-9]*|*.dev*) flag="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG" $flag

  testpypi:
    needs: github-release
    if: vars.PUBLISH_TO_TESTPYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A rehearsal of the PyPI upload, one job and one environment for each package, because a pending
    # trusted publisher is told apart by its environment. Configure the trusted publisher for each
    # project on TestPyPI, and require reviewers on each environment, before setting
    # PUBLISH_TO_TESTPYPI. See docs/RELEASING.md. No token is used: the run's identity authorises it.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/engineering-influence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions of this package
        run: |
          set -eu
          mkdir testpypi-dist
          mv dist/engineering_influence-*.whl dist/engineering_influence-*.tar.gz testpypi-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: testpypi-dist/
          attestations: true
          skip-existing: true

  testpypi-sdk:
    needs: testpypi
    if: vars.PUBLISH_TO_TESTPYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The SDK, after the core has gone up. A failed or skipped core upload skips this.
    environment:
      name: testpypi-sdk
      url: https://test.pypi.org/project/engineering-influence-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions of this package
        run: |
          set -eu
          mkdir testpypi-sdk-dist
          mv dist/engineering_influence_sdk-*.whl dist/engineering_influence_sdk-*.tar.gz testpypi-sdk-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: testpypi-sdk-dist/
          attestations: true
          skip-existing: true

  pypi:
    needs: [github-release, testpypi, testpypi-sdk]
    # PUBLISH_TO_PYPI must be 'true'. If the TestPyPI rehearsal ran, neither upload may have failed or
    # been cancelled; if it was skipped, this goes ahead. `always()` is needed so that a skipped
    # rehearsal does not skip this job, so the release job's success is checked here by hand.
    if: >-
      ${{ always()
      && vars.PUBLISH_TO_PYPI == 'true'
      && needs.github-release.result == 'success'
      && needs.testpypi.result != 'failure'
      && needs.testpypi.result != 'cancelled'
      && needs.testpypi-sdk.result != 'failure'
      && needs.testpypi-sdk.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One job and one environment for each package, because a pending trusted publisher is told apart
    # by its environment. Configure the trusted publisher for each project on PyPI, and require
    # reviewers on each environment, before setting PUBLISH_TO_PYPI. See docs/RELEASING.md.
    environment:
      name: pypi
      url: https://pypi.org/project/engineering-influence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions of this package
        run: |
          set -eu
          mkdir pypi-dist
          mv dist/engineering_influence-*.whl dist/engineering_influence-*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          attestations: true

  pypi-sdk:
    needs: pypi
    if: ${{ always() && vars.PUBLISH_TO_PYPI == 'true' && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The SDK, after the core has been published. If the core was not published, this does not run.
    environment:
      name: pypi-sdk
      url: https://pypi.org/project/engineering-influence-sdk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Keep only the distributions of this package
        run: |
          set -eu
          mkdir pypi-sdk-dist
          mv dist/engineering_influence_sdk-*.whl dist/engineering_influence_sdk-*.tar.gz pypi-sdk-dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-sdk-dist/
          attestations: true
